name: Build and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-tag:
    name: Tag versioned main commit
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create version tag if missing
        id: version
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version"
            exit 1
          fi

          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; no release tag created."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "ServerLab MC $tag"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  branch:
    name: Branch push
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip release build
        run: echo "Release builds are published only from v* tags."

  windows:
    name: Windows installer
    needs: version-tag
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && needs.version-tag.outputs.created == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.version-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build installer
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        run: npm run package:ci

      - name: Verify release assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "ServerLab-MC-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not created."
          }

          $blockmap = Get-ChildItem -Path release -Filter "ServerLab-MC-Setup-*.exe.blockmap" | Select-Object -First 1
          if (-not $blockmap) {
            throw "Installer blockmap was not created."
          }

          if (-not (Test-Path "release/latest.yml")) {
            throw "latest.yml was not created."
          }

          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Blockmap:  $($blockmap.FullName)"

      - name: Create update policy metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $metadata = [ordered]@{
            version = $version
            mandatory = $false
            minSupportedVersion = "3.0.0"
            changelog = @("See the GitHub release notes for ServerLab MC $version.")
          }
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -Path "release/update-meta.json" -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: serverlab-mc-windows-${{ env.RELEASE_TAG }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/update-meta.json
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ServerLab MC ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/update-meta.json
