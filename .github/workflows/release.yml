name: Build and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  branch:
    name: Branch push
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip release build
        run: echo "Release builds are published only from v* tags."

  windows:
    name: Windows installer
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build installer
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        run: npm run package:ci

      - name: Verify release assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "ServerLab MC Setup *.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer was not created."
          }

          $blockmap = Get-ChildItem -Path release -Filter "ServerLab MC Setup *.exe.blockmap" | Select-Object -First 1
          if (-not $blockmap) {
            throw "Installer blockmap was not created."
          }

          if (-not (Test-Path "release/latest.yml")) {
            throw "latest.yml was not created."
          }

          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Blockmap:  $($blockmap.FullName)"

      - name: Create update policy metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $metadata = [ordered]@{
            version = $version
            mandatory = $false
            minSupportedVersion = "3.0.0"
            changelog = @("See the GitHub release notes for ServerLab MC $version.")
          }
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -Path "release/update-meta.json" -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: serverlab-mc-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/update-meta.json
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ServerLab MC ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/update-meta.json
